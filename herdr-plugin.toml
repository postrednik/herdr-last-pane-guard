id = "postrednik.last-pane-guard"
name = "Last Pane Guard"
version = "0.2.0"
min_herdr_version = "0.9.4"
description = "Restore workspaces and tabs lost when their last shell exits."
author = "Rostislav Postrednik"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--locked", "--release", "--target-dir", "target"]

[[startup]]
command = ["target/release/last-pane-guard", "refresh"]

[[actions]]
id = "refresh"
title = "Initialize or refresh Last Pane Guard"
contexts = ["global"]
command = ["target/release/last-pane-guard", "refresh"]

[[panes]]
id = "confirm"
title = "Last Pane Guard"
placement = "popup"
width = "80%"
height = 8
command = ["target/release/last-pane-guard", "confirm"]

[[events]]
on = "pane.exited"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "workspace.created"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "workspace.renamed"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "workspace.moved"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "workspace.reordered"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "workspace.focused"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "workspace.closed"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "tab.created"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "tab.renamed"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "tab.moved"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "tab.focused"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "tab.closed"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "pane.created"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "pane.focused"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "pane.moved"
command = ["target/release/last-pane-guard", "event"]

[[events]]
on = "pane.closed"
command = ["target/release/last-pane-guard", "event"]
